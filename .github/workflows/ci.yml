# Continuous integration: prove a fresh clone builds, type-checks, passes its
# tests, clears the standalone gate, and — the check that catches the most
# common mistake in this repository — that the committed lib/ artifacts match
# what the current src actually builds. A stale artifact means everyone who
# installs from this repository or from npm runs code that no longer matches
# the source they can read.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v6
        with:
          # **与 `release.yml` 同一个版本，而且必须是这一档。**
          #
          # 这里曾经是 22，而发布工作流是 24——于是同一次提交在 CI 上红、在发布时绿，
          # 两条流水线对同一份代码给出两个答案。分量出来的差别不是配置：
          # 在 Node 22 下，vitest 3.2.7 的 jsdom worker 加载 `@vite/env` 会失败
          # （`Error: Cannot find module '/@vite/env'`），于是**五个渲染/拖拽/面板
          # 测试文件整个跑不起来**（113 passed / 118），而那正是这一层图形契约所在。
          #
          # `engines` 仍然声明 `^22.19.0 || >=24.0.0`：**插件在 22 上能跑**，红的只有
          # 测试环境里那一个 jsdom worker。所以这里抬的是「CI 用哪个版本来验」，
          # 不是「插件要求哪个版本」——两件事，不要顺手把 engines 一起改掉。
          node-version: 24
          cache: pnpm

      # Every other gate here exercises the build, the types, the tests and the
      # bundle — none of them parses the helper scripts, and the release helpers
      # only ever run on a tag. A syntax error in one of them therefore reaches
      # the repository and surfaces as a failed publish. Parsing them on every
      # run moves that failure to the commit that introduced it, and costs
      # nothing to keep.
      - name: Script syntax
        run: |
          node -e "const { readdirSync } = require('node:fs'); const { execFileSync } = require('node:child_process'); const walk = (dir) => readdirSync(dir, { withFileTypes: true }).flatMap((entry) => entry.isDirectory() ? walk(dir + '/' + entry.name) : (/\.(mjs|js)$/.test(entry.name) ? [dir + '/' + entry.name] : [])); const names = walk('scripts'); for (const name of names) execFileSync(process.execPath, ['--check', name], { stdio: 'inherit' }); console.log('scripts parsed: ' + names.length);"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify standalone gate
        uses: ./.github/actions/verify

      - name: Committed artifacts match a fresh build
        run: |
          if ! git diff --exit-code --stat -- lib; then
            echo "::error::lib/ is out of date — run 'pnpm build' and commit the result together with the src change."
            echo "--- per-file diff, truncated ---"
            git diff -U1 -- lib | head -300
            exit 1
          fi
