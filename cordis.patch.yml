# dsh-task-board bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:.../dsh-task-board`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the system-prompt announcement section and the settings
# route), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/<id>/client.js) load in the web
# GUI.
- insert:
    - id: dsh-task-board
      name: 'dsh-task-board'
